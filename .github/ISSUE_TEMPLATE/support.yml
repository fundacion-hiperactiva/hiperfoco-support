name: Solicitud de soporte / Support request
description: Informá un problema o pedí ayuda con Hiperfoco. / Report a problem or ask for help with Hiperfoco.
title: "[Soporte]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Gracias por contactarnos. Este Issue será público: no incluyas información personal, médica, credenciales ni otros datos sensibles.

        Thank you for contacting us. This Issue will be public: do not include personal or medical information, credentials, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Descripción del problema / Problem description
      description: Explicá qué ocurrió y qué necesitás resolver. / Explain what happened and what you need help with.
      placeholder: Describí el problema con el mayor detalle posible…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      description: Enumerá los pasos que permiten observar el problema, si corresponde. / List the steps that reproduce the problem, if applicable.
      placeholder: |
        1. Ir a…
        2. Seleccionar…
        3. Observar…
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado / Expected result
      description: ¿Qué esperabas que ocurriera? / What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno / Environment
      description: Indicá dispositivo, sistema operativo, navegador y versión de Hiperfoco, si los conocés. / Include device, operating system, browser, and Hiperfoco version when known.
      placeholder: "Ejemplo: Android 15, Chrome 141"
  - type: dropdown
    id: impact
    attributes:
      label: Impacto / Impact
      options:
        - Me impide usar Hiperfoco / Prevents me from using Hiperfoco
        - Afecta una función importante / Affects an important feature
        - Existe una alternativa temporal / A workaround exists
        - Es una molestia menor / Minor inconvenience
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Información adicional / Additional information
      description: Agregá contexto o capturas sin datos sensibles. / Add context or screenshots without sensitive data.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmaciones / Confirmations
      options:
        - label: Revisé los Issues existentes y no encontré uno equivalente. / I reviewed existing Issues and found no equivalent request.
          required: true
        - label: Confirmo que no incluí datos personales, médicos, credenciales ni otra información sensible. / I confirm that I included no personal or medical data, credentials, or other sensitive information.
          required: true
